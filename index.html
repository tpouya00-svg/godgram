<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213b">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>گودگرام</title>
<style>
:root{--ink:#16213b;--ink2:#22305a;--paper:#f3f5fa;--card:#fff;--text:#16213b;--muted:#6b7694;--me:#2f5bff;--them:#fff;--them-t:#16213b;--gold:#f5b83d;--line:#e2e6f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0e1424;--card:#161e36;--text:#e8ecf8;--muted:#8e9ab9;--them:#1d2747;--them-t:#e8ecf8;--line:#25304f;--ink:#0a0f1e;--ink2:#161e36;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--paper);color:var(--text);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#login{height:100%;display:grid;place-items:center;padding:24px;background:var(--ink)}
.lbox{width:100%;max-width:360px;text-align:center;color:#fff}
.logo{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:46px;font-weight:800}
.lbox h1{font-size:32px;margin-bottom:18px}
.lbox input{width:100%;padding:14px 16px;border-radius:14px;border:0;background:#fff;color:#16213b;margin-bottom:10px;text-align:center}
.lbox input[dir=ltr]{direction:ltr}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--gold);color:#16213b;font-weight:700;cursor:pointer;margin-top:4px}
.link{background:none;border:0;color:#b9c3e3;margin-top:14px;cursor:pointer;text-decoration:underline}
#err{color:#ffb4b4;min-height:24px;font-size:14px;margin-bottom:4px}
#app{display:none;height:100%;grid-template-columns:340px 1fr}
aside{background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.top div{flex:1;line-height:1.4}.top b{font-size:20px;display:block}.top small{color:#b9c3e3;font-size:12px}
.ic{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:6px 8px;border-radius:10px}.ic:hover{background:var(--ink2)}
.search{padding:10px 12px}.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
#list{overflow:auto;flex:1}
.hint{padding:14px 16px;color:var(--muted);font-size:13px;line-height:1.9}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--paper)}
.av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}
.meta{flex:1;min-width:0}.meta b{display:block;font-size:15px}
.meta span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--me);color:#fff;border-radius:99px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:12px}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.head{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);min-height:66px}
.back{display:none;background:none;border:0;font-size:24px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.empty{margin:auto;color:var(--muted);text-align:center;line-height:1.9}
.b{max-width:min(78%,480px);padding:8px 12px;border-radius:16px;line-height:1.7;word-break:break-word;background:var(--them);color:var(--them-t);align-self:flex-end;border-end-end-radius:4px}
.b.me{background:var(--me);color:#fff;align-self:flex-start;border-end-end-radius:16px;border-end-start-radius:4px}
.b small{display:block;font-size:11px;opacity:.75;margin-top:2px}
form{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
form input{flex:1;padding:12px 16px;border-radius:24px;border:1px solid var(--line);background:var(--paper)}
form button{width:46px;height:46px;border:0;border-radius:50%;background:var(--me);color:#fff;font-size:18px;cursor:pointer}
.b img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px}.b .fn{font-size:12px;font-weight:700;color:var(--gold)}#at{background:var(--paper);color:var(--text)}
@media (max-width:720px){#app{grid-template-columns:1fr}#app.chat aside{display:none}#app:not(.chat) main{display:none}.back{display:block}}
</style>
</head>
<body>
<section id="login"><div class="lbox">
  <div class="logo">گ</div><h1>گودگرام</h1>
  <input id="fn" placeholder="نام نمایشی" maxlength="30" style="display:none">
  <input id="fu" dir="ltr" placeholder="username" maxlength="20" autocomplete="username" autocapitalize="none">
  <input id="fp" dir="ltr" type="password" placeholder="رمز عبور" autocomplete="current-password">
  <div id="err" role="alert"></div>
  <button class="btn" id="go">ورود</button>
  <button class="link" id="sw">حساب نداری؟ ثبت‌نام کن</button>
</div></section>

<div id="app">
  <aside>
    <div class="top"><div><b>گودگرام</b><small id="who"></small></div><button class="ic" id="ng" title="گروه جدید" aria-label="گروه جدید">👥</button><button class="ic" id="out" title="خروج" aria-label="خروج">⎋</button></div>
    <div class="search"><input id="q" placeholder="جستجوی کاربر با نام یا username"></div>
    <div id="list"></div>
  </aside>
  <main>
    <div class="head"><button class="back" id="back" aria-label="بازگشت">›</button><div class="av" id="hav"></div><div class="meta"><b id="ht"></b><span id="hs"></span></div></div>
    <div id="msgs"><div class="empty">یک گفتگو را انتخاب کن،<br>یا با جستجو کاربر جدید پیدا کن.</div></div>
    <form id="f" autocomplete="off"><button type="button" id="at" aria-label="ارسال عکس">📎</button><input id="img" type="file" accept="image/*" hidden><input id="t" placeholder="پیام بنویس..." aria-label="متن پیام" disabled><button aria-label="ارسال">➤</button></form>
  </main>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)}, T=localStorage.getItem('gg_t'), ME=null, cur=null, chats=[], reg=false, es=null;
var COL=['#2f5bff','#e0952b','#1f9e8b','#b5479b','#d6543e','#5a6bd6'];
function color(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return COL[Math.abs(h)%COL.length]}
function isG(u){return u.indexOf('g:')===0}
function time(t){return new Date(t).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
function api(p,body){
  return fetch('/api/'+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:body?JSON.stringify(body):undefined})
   .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
     if(r.status===401&&T&&j.error==='auth'){logout(true)}
     if(!r.ok)throw j; return j})});
}
function logout(){localStorage.removeItem('gg_t');if(es)es.close();location.reload()}

/* auth */
function setMode(r){reg=r;$('fn').style.display=r?'':'none';$('go').textContent=r?'ساخت حساب':'ورود';$('sw').textContent=r?'حساب داری؟ وارد شو':'حساب نداری؟ ثبت‌نام کن';$('err').textContent=''}
$('sw').onclick=function(){setMode(!reg)};
$('go').onclick=function(){
  fetch('/api/'+(reg?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:$('fu').value,p:$('fp').value,name:$('fn').value})})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})
   .then(function(j){T=j.token;localStorage.setItem('gg_t',T);boot()})
   .catch(function(e){$('err').textContent=e.error||'خطا در اتصال به سرور'});
};
$('fp').onkeydown=function(e){if(e.key==='Enter')$('go').click()};

/* app */
function boot(){
  api('me').then(function(m){
    ME=m;$('login').style.display='none';$('app').style.display='grid';$('who').textContent=m.name+' · @'+m.u;
    loadChats();connect();
    if(window.Notification&&Notification.permission==='default')Notification.requestPermission();
  }).catch(function(){});
}
function connect(){
  es=new EventSource('/api/stream?token='+T);
  es.onmessage=function(e){
    var ev=JSON.parse(e.data);
    if(ev.type==='presence')setPres(ev.u,{online:ev.online,lastSeen:ev.t});
    if(ev.type==='msg'&&cur&&(ev.msg.from===cur.u||ev.msg.to===cur.u))loadMsgs();
    else if(ev.type==='read'&&cur&&cur.u===ev.by)loadMsgs(true);
    if(ev.type==='msg'||ev.type==='group')loadChats();
    if(ev.type==='msg'&&ev.msg.from!==ME.u&&document.hidden&&window.Notification&&Notification.permission==='granted')new Notification('گودگرام',{body:'پیام جدید دریافت کردی'});
  };
}
function row(u,name,sub,unread,on){
  var r=document.createElement('div');r.className='row'+(on?' on':'');r.tabIndex=0;
  var a=document.createElement('div');a.className='av';a.style.background=color(u);a.textContent=(name||u)[0].toUpperCase();
  var m=document.createElement('div');m.className='meta';var b=document.createElement('b');b.textContent=name;var s=document.createElement('span');s.textContent=sub;m.append(b,s);r.append(a,m);
  if(unread){var d=document.createElement('div');d.className='badge';d.textContent=unread.toLocaleString('fa-IR');r.append(d)}
  r.onclick=function(){open({u:u,name:name})};r.onkeydown=function(e){if(e.key==='Enter')open({u:u,name:name})};
  return r;
}
function renderChats(){
  var box=$('list');box.innerHTML='';
  if(!chats.length){var h=document.createElement('div');h.className='hint';h.textContent='هنوز گفتگویی نداری. نام یا username دوستت را جستجو کن و پیام بده.';box.append(h)}
  chats.forEach(function(c){box.append(row(c.u,c.name,c.last?((c.last.from===ME.u?'تو: ':'')+(c.last.text||'📷 عکس')):'گروه جدید',c.unread,cur&&cur.u===c.u))});
}
function loadChats(){api('chats').then(function(c){chats=c;if(!$('q').value.trim())renderChats()}).catch(function(){})}
var qt;$('q').oninput=function(){
  clearTimeout(qt);var q=$('q').value.trim();
  if(!q){renderChats();return}
  qt=setTimeout(function(){api('users?q='+encodeURIComponent(q)).then(function(us){
    var box=$('list');box.innerHTML='';
    if(!us.length){var h=document.createElement('div');h.className='hint';h.textContent='کاربری پیدا نشد.';box.append(h)}
    us.forEach(function(u){box.append(row(u.u,u.name,'@'+u.u,0,false))});
  })},250);
};
function setPres(u,r){if(!cur||cur.u!==u)return;$('hs').textContent=r.online?'آنلاین':(r.lastSeen?'آخرین بازدید '+time(r.lastSeen):'آفلاین')}
function open(p){
  cur=p;$('q').value='';$('t').disabled=false;$('ht').textContent=p.name;$('hs').textContent=isG(p.u)?'گروه':'@'+p.u;
  if(!isG(p.u))api('presence?u='+encodeURIComponent(p.u)).then(function(r){setPres(p.u,r)}).catch(function(){});
  var a=$('hav');a.textContent=(p.name||p.u)[0].toUpperCase();a.style.background=color(p.u);
  $('app').classList.add('chat');renderChats();loadMsgs();$('t').focus();
}
function loadMsgs(){
  var who=cur.u;
  api('messages?with='+who).then(function(list){
    if(!cur||cur.u!==who)return;
    var box=$('msgs');box.innerHTML='';
    if(!list.length){var e=document.createElement('div');e.className='empty';e.textContent='هنوز پیامی نیست. سلام کن 👋';box.append(e)}
    list.forEach(function(m){
      var mine=m.from===ME.u,d=document.createElement('div');d.className='b'+(mine?' me':'');
      if(!mine&&isG(cur.u)){var fn=document.createElement('div');fn.className='fn';fn.textContent=m.fn||m.from;d.append(fn)}
      if(m.img){var im=document.createElement('img');im.src=m.img;d.append(im)}
      var t=document.createElement('div');t.textContent=m.text;
      var s=document.createElement('small');s.textContent=time(m.t)+(mine&&!isG(cur.u)?(m.read?' ✓✓':' ✓'):'');
      d.append(t,s);box.append(d);
    });
    box.scrollTop=box.scrollHeight;loadChats();
  }).catch(function(){});
}
$('f').onsubmit=function(e){
  e.preventDefault();var txt=$('t').value.trim();if(!txt||!cur)return;$('t').value='';
  api('send',{to:cur.u,text:txt}).catch(function(x){alert(x.error||'ارسال نشد')});
};
$('back').onclick=function(){$('app').classList.remove('chat');cur=null;renderChats()};
$('out').onclick=function(){if(confirm('از حساب خارج می‌شوی؟'))logout()};
$('ng').onclick=function(){
  var n=prompt('نام گروه:');if(!n)return;
  var m=prompt('username اعضا را با کاما جدا کن (مثلاً ali,sara):');if(!m)return;
  api('group',{name:n,members:m.split(/[,،\s]+/).filter(Boolean)}).then(function(g){loadChats();open(g)}).catch(function(x){alert(x.error||'خطا')});
};
$('at').onclick=function(){if(cur)$('img').click()};
$('img').onchange=function(){
  var f=this.files[0];this.value='';if(!f||!cur)return;
  var im=new Image();im.onload=function(){
    var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    api('send',{to:cur.u,text:'',img:c.toDataURL('image/jpeg',0.7)}).catch(function(x){alert(x.error||'ارسال نشد')});
    URL.revokeObjectURL(im.src);
  };im.src=URL.createObjectURL(f);
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
if(T)boot();
})();
</script>
</body>
</html>
